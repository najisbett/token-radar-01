<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar: pre-token protocols ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#board">Skip to the board</a>
<header class="top">
  <h1>Pre-token protocols, ranked by implied value</h1>
  <p id="meta" class="meta"></p>
</header>
<main class="layout">
  <section class="board-wrap" aria-label="Ranked board">
    <form class="filters" role="search" onsubmit="return false">
      <label>Search by name or chain
        <input id="q" type="search" autocomplete="off" placeholder="Type a protocol or chain">
      </label>
      <label>Category
        <select id="category"><option value="all">All categories</option></select>
      </label>
      <label>Chain
        <select id="chain"><option value="all">All chains</option></select>
      </label>
      <p id="count" class="count" aria-live="polite"></p>
    </form>
    <div class="table-scroll">
      <table id="board" tabindex="-1">
        <caption class="sr">Protocols with no token, highest implied value first. Select a row to see its farm steps.</caption>
        <thead>
          <tr>
            <th scope="col" class="num" aria-sort="none" data-sort="rank"><button type="button" class="sort">Rank<span class="arrow" aria-hidden="true"></span></button></th>
            <th scope="col">Name</th>
            <th scope="col">Category</th>
            <th scope="col">Chain</th>
            <th scope="col" class="num" aria-sort="none" data-sort="tvl"><button type="button" class="sort">TVL<span class="arrow" aria-hidden="true"></span></button></th>
            <th scope="col" class="num" aria-sort="none" data-sort="implied"><button type="button" class="sort">Implied value<span class="arrow" aria-hidden="true"></span></button></th>
            <th scope="col" class="num">Farm count</th>
            <th scope="col" class="go"><span class="sr">Open</span></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="empty" hidden>No protocol matches. Clear the search or pick All categories.</p>
  </section>
  <aside id="detail" class="detail" aria-label="Protocol details" hidden></aside>
</main>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
